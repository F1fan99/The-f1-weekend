<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My F1 Weekend · United States GP 2026</title>
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e10600; --s1:#ff3b3b; --s2:#3d8bff; --s3:#ffd60a;
  --tx:#f2f3f5; --tx2:#a9aeb6; --tx3:#6d737c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --panel:rgba(12,13,16,.80); --panel2:rgba(22,24,28,.85);
  --carbon:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2228%22%20height%3D%2228%22%20viewBox%3D%220%200%2028%2028%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22gh%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2334373c%22/%3E%3Cstop%20offset%3D%22.35%22%20stop-color%3D%22%23202226%22/%3E%3Cstop%20offset%3D%22.8%22%20stop-color%3D%22%23121315%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230b0c0d%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22gv%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231c1e21%22/%3E%3Cstop%20offset%3D%22.4%22%20stop-color%3D%22%23141517%22/%3E%3Cstop%20offset%3D%22.85%22%20stop-color%3D%22%230c0d0e%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2308090a%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2228%22%20height%3D%2228%22%20fill%3D%22%23060708%22/%3E%3Crect%20x%3D%220.5%22%20y%3D%220.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%22-27.5%22%20y%3D%220.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2228.5%22%20y%3D%220.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%227.5%22%20y%3D%227.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%22-20.5%22%20y%3D%227.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2235.5%22%20y%3D%227.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2214.5%22%20y%3D%2214.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%22-13.5%22%20y%3D%2214.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2242.5%22%20y%3D%2214.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%2221.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%22-6.5%22%20y%3D%2221.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%2249.5%22%20y%3D%2221.5%22%20width%3D%2213%22%20height%3D%226%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gh%29%22/%3E%3Crect%20x%3D%220.5%22%20y%3D%227.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%220.5%22%20y%3D%22-20.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%220.5%22%20y%3D%2235.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%227.5%22%20y%3D%2214.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%227.5%22%20y%3D%22-13.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%227.5%22%20y%3D%2242.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2214.5%22%20y%3D%2221.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2214.5%22%20y%3D%22-6.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2214.5%22%20y%3D%2249.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%220.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%22-27.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%2228.5%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%222.2%22%20fill%3D%22url%28%23gv%29%22/%3E%3C/svg%3E");
  --r:14px;
}
*{box-sizing:border-box}
html{background:#060708;color-scheme:dark}
body{
  margin:0;color:var(--tx);font-family:"Titillium Web",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;
  background:#08090a var(--carbon) repeat;background-size:28px 28px;background-attachment:fixed;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
/* sheen + vignette over the weave */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   linear-gradient(115deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.075) 38%,rgba(255,255,255,.02) 48%,rgba(255,255,255,0) 60%),
   radial-gradient(1200px 600px at 75% -10%,rgba(255,255,255,.07),transparent 60%),
   radial-gradient(900px 700px at 10% 110%,rgba(225,6,0,.06),transparent 60%);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%);}
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 clamp(12px,2.4vw,32px) 48px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:#fff}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
  background:linear-gradient(180deg,rgba(6,7,8,.92),rgba(6,7,8,.72));border-bottom:1px solid var(--line)}
.topbar .in{max-width:1440px;margin:0 auto;padding:10px clamp(12px,2.4vw,32px);display:flex;gap:14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;font-size:15px}
.brand .mk{width:30px;height:18px;background:var(--red);transform:skewX(-22deg);border-radius:2px;box-shadow:6px 0 0 -2px #fff}
.brand span{color:var(--tx2);font-weight:400}
.topbar .in .sp{flex:1}
.calbar{max-width:1440px;margin:0 auto;padding:0 clamp(12px,2.4vw,32px) 10px;display:flex;gap:6px;align-items:stretch}
.calbtn{flex:none;width:32px;border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:9px;color:var(--tx);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.calbtn:hover:not(:disabled){background:rgba(255,255,255,.1)}.calbtn:disabled{opacity:.3;cursor:default}
.cal{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);padding:0 6px}
.cal::-webkit-scrollbar{display:none}
.wk{flex:none;width:106px;scroll-snap-align:center;text-align:left;border:1px solid var(--line2);background:rgba(255,255,255,.045);border-radius:9px;padding:5px 9px 6px;cursor:pointer;color:var(--tx);font:inherit;position:relative;overflow:hidden;transition:background .15s,opacity .15s}
.wk:hover{background:rgba(255,255,255,.09)}
.wk .r{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;align-items:center;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--tx3);line-height:1.3}
.wk .n{display:block;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .d{display:block;font-size:11px;color:var(--tx2);line-height:1.25;white-space:nowrap}
.wk .tag{font-size:9px;letter-spacing:.08em;padding:0 4px;border-radius:3px;border:1px solid var(--line2);color:var(--tx2)}
.wk .win{display:inline-flex;align-items:center;gap:3px;color:var(--tx2)}.wk .win i{width:3px;height:9px;border-radius:1px;background:var(--c)}
.wk.past{background:transparent;border-color:var(--line);opacity:.62}
.wk.past .n{font-weight:600}
.wk.past:hover{opacity:.95}
.wk.cur{border-color:var(--red);box-shadow:inset 0 2px 0 var(--red)}
.wk.cur .tag{background:var(--red);border-color:var(--red);color:#fff}
.wk.on{background:#fff;border-color:#fff;color:#111;opacity:1}
.wk.on .r,.wk.on .d,.wk.on .win{color:#555}.wk.on .tag{border-color:#bbb;color:#333}.wk.on.cur .tag{color:#fff;border-color:var(--red)}
.wk:focus-visible,.calbtn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.ctx{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--tx2)}
.ctx b{color:var(--tx);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.ctx .pill{font-size:11px}
.note{font-size:12px;color:var(--tx3);margin-top:10px}
.north{pointer-events:none}.north text{font-size:13px;font-weight:700;fill:var(--tx2);text-anchor:middle}
.next{white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.next .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.next.live .dot{background:var(--red);box-shadow:0 0 0 0 rgba(225,6,0,.7);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(225,6,0,0)}100%{box-shadow:0 0 0 0 rgba(225,6,0,0)}}
.next .lbl{color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}

/* hero map */
.hero{position:relative;margin-top:14px;border-radius:20px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(1000px 520px at 40% 40%,rgba(255,255,255,.035),transparent 70%),linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 80px -30px rgba(0,0,0,.8)}
.hero::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--red),var(--red) 30%,transparent 30.4%,transparent 31%,#fff 31%,#fff 31.6%,transparent 31.6%)}
.mapbox{position:relative;aspect-ratio:1000/620}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.title{position:absolute;left:2.6%;top:4.5%;max-width:36%;z-index:2}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx2);font-weight:700;display:flex;gap:8px;align-items:center}
.kicker i{display:inline-block;width:18px;height:3px;background:var(--red)}
.title h1{margin:4px 0 2px;font-size:clamp(26px,3.4vw,50px);line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.title h1 em{font-style:normal;color:var(--tx2);font-weight:300}
.title .sub{color:var(--tx2);font-size:clamp(13px,1.1vw,16px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.legend i.sm{background:repeating-linear-gradient(90deg,#fff 0 5px,transparent 5px 9px);height:3px}
.legend i.om{width:9px;height:9px;transform:rotate(45deg);background:#fff;border-radius:1px;border:2px solid #0b0c0e;outline:1px solid #fff}
.overlay{position:absolute;z-index:2;right:2%;bottom:3.5%;width:39%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:linear-gradient(180deg,rgba(18,19,23,.86),rgba(10,11,13,.86));border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:700}
.stat .v{font-size:clamp(17px,1.65vw,25px);font-weight:700;line-height:1.1}
.stat .d{font-size:12px;color:var(--tx2)}
.trk-edge{fill:none;stroke:rgba(255,255,255,.16);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.trk-base{fill:none;stroke:#0b0c0e;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}
.trk-sec{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
.trk-hit{fill:none;stroke:transparent;stroke-width:26;cursor:help}
.zone{fill:none;stroke:#fff;stroke-width:3.2;stroke-dasharray:9 7;stroke-linecap:butt;pointer-events:none}
.zone-hit{fill:none;stroke:transparent;stroke-width:22;cursor:help}
.zlab{font-size:13px;font-weight:700;fill:#fff;letter-spacing:.08em;paint-order:stroke;stroke:#060708;stroke-width:4px}
.cn line{stroke:rgba(255,255,255,.35);stroke-width:1.2}
.cn circle.b{fill:#121317;stroke:rgba(255,255,255,.55);stroke-width:1.5}
.cn text{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cn.named{cursor:pointer}
.cn.named circle.b{stroke:var(--red);stroke-width:2.6}
.cn.sel circle.b{fill:#fff;stroke:#fff}.cn.sel text{fill:#111}
.cn .ap{fill:#fff;opacity:0}
.cn.sel .ap{opacity:1;filter:url(#glow)}
.cn:hover circle.b{stroke:#fff}
.sf{stroke:#fff;stroke-width:6;stroke-dasharray:4 4}
.sflab{font-size:12px;font-weight:700;fill:var(--tx2);letter-spacing:.1em}

/* layout */
.grid{display:grid;gap:16px;margin-top:16px}
.g-2-1{grid-template-columns:2fr 1fr}.g-1-1{grid-template-columns:1fr 1fr}.g-3-2{grid-template-columns:3fr 2fr}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 50px -30px rgba(0,0,0,.9);backdrop-filter:blur(3px)}
.h{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.h::before{content:"";width:6px;height:18px;background:var(--red);transform:skewX(-20deg);border-radius:1px}
.h .sp{flex:1}
.h small{font-size:12px;text-transform:none;letter-spacing:0;color:var(--tx3);font-weight:400}
.seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.04em}
.seg button.on{background:#fff;color:#111}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);font-weight:700;margin:14px 0 8px}

/* named corners */
.corners{display:grid;grid-template-columns:200px 1fr;gap:16px}
.clist{display:flex;flex-direction:column;gap:6px}
.cbtn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:9px 10px;cursor:pointer}
.cbtn .t{font-size:11px;color:var(--tx3);font-weight:700;letter-spacing:.06em}
.cbtn b{display:block;font-size:15px}
.cbtn .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.cbtn.on{background:#fff;color:#111;border-color:#fff}.cbtn.on .t{color:#555}
.cdet{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.cdet figure{margin:0}
.cdet img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line2)}
.cdet figcaption{font-size:12px;color:var(--tx3);margin-top:6px}
.cdet h3{margin:0 0 6px;font-size:24px;font-weight:900;line-height:1.05;text-transform:uppercase}
.cdet .turns{display:flex;gap:6px;margin-bottom:10px}
.cdet .turns span{font-size:12px;font-weight:700;border:1px solid var(--line2);padding:1px 8px;border-radius:999px;color:var(--tx2)}
.cdet p{margin:0 0 10px}
.cdet .src{font-size:12px;color:var(--tx3)}

/* key/value lists */
.kv{display:flex;flex-direction:column}
.kv div{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding-top:2px}
.kv dd{margin:0}

/* schedule */
.sess{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .day{font-size:12px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sess .day b{display:block;color:var(--tx);font-size:20px;line-height:1.05;letter-spacing:0}
.sess .nm{font-weight:700;font-size:16px}
.sess .tm{color:var(--tx2);font-size:13px}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 8px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.pill.live{background:var(--red);border-color:var(--red);color:#fff}
.pill.done{color:var(--tx3);border-color:var(--line)}
.pill.next{background:#fff;color:#111;border-color:#fff}
.prog{grid-column:1/-1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:-4px}
.prog i{display:block;height:100%;background:var(--red)}
.sess.race .nm{color:#fff}.sess.race{background:linear-gradient(90deg,rgba(225,6,0,.12),transparent 60%)}
.callout{margin-top:14px;border:1px solid rgba(225,6,0,.45);background:linear-gradient(135deg,rgba(225,6,0,.16),rgba(225,6,0,.03));border-radius:12px;padding:12px 14px}
.callout b{display:block;font-size:16px;margin-bottom:2px}

/* team badge */
.tm-b{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--tx2)}
.tm-b i{width:4px;height:14px;border-radius:2px;background:var(--c)}
.tm-b.box{border:1px solid var(--line2);border-radius:5px;padding:1px 7px 1px 5px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
th.l,td.l{text-align:left}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
th.on{color:#fff}th.on::after{content:" ▾";color:var(--red)}th.on.asc::after{content:" ▴"}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr{cursor:default}tbody tr:hover td{background:rgba(255,255,255,.035)}
tr.pick td{background:rgba(255,255,255,.06)}
td.pos{font-weight:700;color:var(--tx2);width:28px}
td .dn{font-weight:700}
td .cd{color:var(--tx3);font-size:12px;margin-left:6px}
td.pts{font-weight:700;font-size:16px}
.bar-l{border-left:3px solid var(--c);padding-left:8px}

/* driver picker */
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.dchip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:7px;padding:4px 9px 4px 7px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.dchip i{width:4px;height:14px;border-radius:2px;background:var(--c)}
.dchip.on{background:#fff;color:#111;border-color:#fff}
.dhead{display:flex;gap:18px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.dnum{font-size:clamp(56px,7vw,92px);font-weight:900;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--c);min-width:1.4em;text-align:center;font-style:italic}
.dhead h3{margin:0;font-size:clamp(24px,3vw,38px);font-weight:900;line-height:1;text-transform:uppercase}
.dhead h3 span{font-weight:300}
.dhead .meta{display:flex;gap:10px;align-items:center;margin-top:6px;color:var(--tx2);font-size:14px;flex-wrap:wrap}
.dhead::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:180px;background:linear-gradient(90deg,transparent,var(--c));opacity:.18;transform:skewX(-20deg)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700}
.metric .v{font-size:24px;font-weight:700;line-height:1.1}
.metric .d{font-size:12px;color:var(--tx2)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.rc{height:34px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);color:var(--tx2);cursor:default}
.rc.w{background:var(--c);color:#000}
.rc.p{background:color-mix(in srgb,var(--c) 55%,#111);color:#fff}
.rc.pt{background:color-mix(in srgb,var(--c) 22%,#16181b);color:#fff}
.rc.r{background:transparent;border:1px solid rgba(255,59,59,.6);color:#ff6b6b}
.rc.n{background:transparent;border:1px dashed var(--line2);color:var(--tx3)}
.rlab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;font-size:10px;color:var(--tx3);text-align:center;margin-top:3px}
.h2h{display:flex;flex-direction:column;gap:10px}
.h2h .row{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-weight:700}
.h2h .row span:last-child{text-align:right}
.h2h .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.06)}
.h2h .bar i{display:block;height:100%}
.h2h .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700;text-align:center;grid-column:1/-1;margin-bottom:-6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:inherit}
.ax{font-size:11px;fill:var(--tx3)}
.gl{stroke:rgba(255,255,255,.07)}

/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(10,11,13,.96);border:1px solid var(--line2);border-left:3px solid var(--red);border-radius:8px;padding:7px 10px;font-size:13px;white-space:pre-line;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:700}
footer{margin-top:22px;color:var(--tx3);font-size:12px;line-height:1.6}
footer p{margin:0 0 6px}

@media (max-width:1100px){
  .g-2-1,.g-3-2{grid-template-columns:1fr}
  .corners{grid-template-columns:1fr}.clist{flex-direction:row;overflow-x:auto}.cbtn{flex:none}
}
@media (max-width:820px){
  .title{position:static;max-width:none;padding:18px 16px 0}
  .mapbox{margin:4px -2% 0 -2%}
  .overlay{position:static;width:auto;grid-template-columns:repeat(3,1fr);padding:0 12px 12px}
  .g-1-1{grid-template-columns:1fr}
  .cdet{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .next .lbl{display:none}
  .brand span{display:none}
}
@media (max-width:560px){
  body{font-size:14px}
  .overlay{grid-template-columns:repeat(2,1fr)}
  .topbar .in{flex-wrap:wrap;gap:8px 10px}
  .wk{width:100px;padding:4px 7px 5px}.wk .n{font-size:13px}.wk .r{font-size:9px;letter-spacing:.05em}.wk .tag{font-size:8px;padding:0 3px}
  .calbtn{width:28px}
  .next{margin-left:auto}
  .panel{padding:14px 12px}
  .kv div{grid-template-columns:1fr;gap:2px}
  .hide-s{display:none}
  .sess{grid-template-columns:70px 1fr auto}
  .h small{display:none}
  .cn circle.b{r:21px}.cn text{font-size:21px}
  .trk-sec{stroke-width:10}.sflab{display:none}.zlab{font-size:20px}
}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <div class="brand"><i class="mk"></i>My F1 Weekend <span>· 2026</span></div>
  <span class="sp"></span>
  <div class="next" id="next"></div>
</div>
<div class="calbar"><button class="calbtn" id="calprev" aria-label="Previous race weekend">‹</button><nav class="cal" id="cal" aria-label="2026 race calendar"></nav><button class="calbtn" id="calnext" aria-label="Next race weekend">›</button></div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <div class="title" id="title"></div>
    <div class="mapbox" id="map"></div>
    <div class="overlay" id="overlay"></div>
  </section>

  <div class="grid g-2-1" id="g-corners">
    <section class="panel" id="p-corners"><h2 class="h">Named corners<span class="sp"></span><small>Tap a corner on the map or the list</small></h2><div id="corners"></div></section>
    <section class="panel"><h2 class="h">Track info</h2><dl class="kv" id="info"></dl></section>
  </div>

  <div class="grid g-1-1" id="g-sched">
    <section class="panel"><h2 class="h">Weekend schedule<span class="sp"></span><div class="seg" id="zones"></div></h2><div id="sched"></div></section>
    <section class="panel" id="p-hist"><h2 class="h">At this track</h2><dl class="kv" id="hist"></dl><div id="clinch"></div></section>
  </div>

  <div class="ctx" id="ctx"></div>
  <div class="grid g-3-2" style="margin-top:10px">
    <section class="panel"><h2 class="h">Driver standings<span class="sp"></span><small id="asof"></small></h2><div class="tbl-wrap" id="standings"></div></section>
    <section class="panel"><h2 class="h">Points</h2><div class="chart" id="ptsbars"></div></section>
  </div>

  <section class="panel grid" style="display:block"><h2 class="h">Driver stats</h2>
    <div class="dchips" id="dchips"></div>
    <div id="driver"></div>
  </section>

  <section class="panel grid" style="display:block"><h2 class="h">Title fight<span class="sp"></span><div class="seg" id="fightmode"></div></h2><div class="chart" id="fight"></div></section>

  <div class="grid g-1-1" id="g-teams">
    <section class="panel"><h2 class="h">Constructors</h2><div class="tbl-wrap" id="teams"></div><div class="chart" id="teambars" style="margin-top:14px"></div></section>
    <section class="panel" id="p-last"><h2 class="h" id="lasth">Results<span class="sp"></span><div class="seg" id="lastkind" style="margin-right:6px"></div><div class="seg" id="lastmode"></div></h2><div class="muted" id="lastcap" style="font-size:13px;margin:-6px 0 10px"></div><div class="tbl-wrap" id="last"></div></section>
  </div>

  <footer id="foot"></footer>
</main>
<div id="tip" role="tooltip"></div>

<script>

// ---------- Season engine: standings + stats as they stood after round N (from Jolpica results) ----------

function seasonAt(N){
  const DRV=SEASON.drv, rounds=SEASON.done.filter(r=>r<=N);

  const order=st.d.split(",").map(x=>{const f=x.split(":");return {code:f[0],pts:+f[1],wins:+f[2]};});
  const R={}; rounds.forEach(r=>{const x=SEASON.res[r];R[r]={race:rows(x.race),sprint:rows(x.sprint),quali:rows(x.quali)};});
  const D=order.map((o,i)=>{
    const [name,num,nat]=DRV[o.code]; let team=null;
    const d={code:o.code,name,num,nat,pts:o.pts,wins:o.wins,pos:i+1,podiums:0,poles:0,dnfs:0,dns:0,starts:0,classified:0,best:0,avg:null,fl:0,spts:0,swins:0,pr:[],res:[],h2h:[]};
    let sum=0;

      let p=0;

        if(rr[8]==="1")d.fl++;

      } else d.res.push("");
      if(sr){p+=+sr[7];d.spts+=+sr[7];if(sr[3]==="1")d.swins++;}

        const m=hm[f[0]]||(hm[f[0]]={name:DRV[f[0]][0],rw:0,rl:0,qw:0,ql:0,first:r}); me<j?m.rw++:m.rl++;

    return d;
  });
  const T=st.c.split(",").map((x,i)=>{const f=x.split(":");const t={pos:i+1,team:f[0],pts:+f[1],wins:+f[2],podiums:0,poles:0,drivers:[]};
    rounds.forEach(r=>{R[r].race.forEach(g=>{if(g[1]===t.team&&/^[123]$/.test(g[3]))t.podiums++;});R[r].quali.forEach(g=>{if(g[1]===t.team&&g[2]==="1")t.poles++;});});
    t.drivers=D.filter(d=>d.team===t.team).map(d=>d.code); return t;});
  return {D,T,R,rounds};
}

const RC = r => (ROUNDS[r-1]||{}).code||("R"+r);           // short round code for chart axes
const RN = r => { const x=ROUNDS[r-1]; return x?`R${r} ${x.short}`:"Round "+r; }; // round name for tooltips
const CURRENT = (ROUNDS.find(r=>!r.done)||ROUNDS[ROUNDS.length-1]).key;
const LASTDONE = Math.max(...SEASON.done);
function fmtTime(iso,zone){return new Intl.DateTimeFormat("en-US",{timeZone:zone,hour:"numeric",minute:"2-digit"}).format(new Date(iso));}
function fmtDay(iso,zone){const p=new Intl.DateTimeFormat("en-US",{timeZone:zone,weekday:"short",month:"short",day:"numeric"}).formatToParts(new Date(iso));const g=t=>(p.find(x=>x.type===t)||{}).value;return {wd:g("weekday"),md:g("month")+" "+g("day")};}
function dur(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,"0");return (d?d+"d ":"")+p(h)+":"+p(m)+":"+p(x);}

// ---------- State ----------
const S = {key:null,W:null,N:0,past:false,A:null,D:[],T:[],zone:"CT",corner:null,sort:{k:"pts",asc:false},pick:null,fight:"cum",lastAll:false,kind:"race"};

function setWeekend(key,scrollCal){
  const W=WEEKENDS[key]; if(!W) return;

  renderAll(); centerChip(scrollCal!==false);
}
function go(dir){const i=ROUNDS.findIndex(r=>r.key===S.key), n=ROUNDS[i+dir]; if(n){history.replaceState(null,"","#"+n.key);setWeekend(n.key);}}
function renderAll(){renderCal();renderTitle();renderMap();renderOverlay();renderCorners();renderInfo();renderZones();renderSched();renderHist();renderStandings();renderPtsBars();renderChips();renderDriver();renderFight();renderTeams();renderLast();renderFoot();tick();}

// ---------- Calendar strip (WEEKENDS-driven) ----------
function winnerOf(r){const x=SEASON.res[r]; if(!x) return null; const f=rows(x.race).find(f=>f[3]==="1"); return f?{code:f[0],team:f[1]}:null;}
function weekendLive(w){const W=WEEKENDS[w.key],now=Date.now(),s=W.sessions; return now>=Date.parse(s[0].start)&&now<=Date.parse(s[s.length-1].start)+s[s.length-1].mins*60000;}
function renderCal(){
  const el=$("#cal");
  if(!el.children.length) el.innerHTML=ROUNDS.map(w=>{
    const win=w.done&&winnerOf(w.round), cur=w.key===CURRENT;
    const right=win?`<span class="win" style="--c:${tcol(win.team)}" title="Winner"><i></i>${win.code}</span>`:cur?`<span class="tag">${weekendLive(w)?"NOW":"NEXT"}</span>`:w.sprint?`<span class="tag">SPRINT</span>`:"";
    const tip=`<b>Round ${w.round} · ${esc(w.gp)}</b>\n${esc(w.dates)}${w.sprint?" · Sprint weekend":""}${win?`\nWinner: ${esc(SEASON.drv[win.code][0])}`:cur?"\nNext up":""}`;
    return `<button class="wk${w.done?" past":""}${cur?" cur":""}" data-wk="${w.key}" data-tip="${esc(tip)}"><span class="r"><span>R${w.round} · ${w.cc}</span>${right}</span><span class="n">${esc(w.short)}</span><span class="d">${esc(w.dates.replace(/, \d{4}$/,""))}</span></button>`;}).join("");
  el.querySelectorAll(".wk").forEach(b=>{const on=b.dataset.wk===S.key;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"true":"false");b.tabIndex=on?0:-1;});

}
function centerChip(smooth){const el=$("#cal"), b=el.querySelector(".wk.on"); if(!b) return; el.scrollTo({left:b.offsetLeft-el.clientWidth/2+b.offsetWidth/2,behavior:smooth?"smooth":"auto"});}

// ---------- Hero ----------
function renderTitle(){
  const W=S.W, m=W.gp.match(/^(.*?) (Grand Prix.*)$/)||[0,W.gp,""], T=W.track;
  $("#title").innerHTML=`<div class="kicker"><i></i>Round ${W.round} / ${W.totalRounds} · ${W.dates}</div>
  <h1>${esc(m[1])}<br><em>${esc(m[2])}</em></h1>

  ${W.zones?`<span><i class="sm"></i>Straight Mode (approx.)</span><span><i class="om"></i>Overtake detection</span>`:""}</div>`;
}
function renderOverlay(){
  $("#overlay").innerHTML=S.W.overlay.map(o=>`<div class="stat"><div class="k">${esc(o.label)}</div><div class="v num">${esc(o.value)}</div>${o.detail?`<div class="d">${esc(o.detail)}</div>`:""}</div>`).join("");
}
function renderMap(){
  const T=S.W.track,named={};
  if(!T){$("#map").innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:14px">Track outline not available for this circuit yet</div>`;return;}
  const [w,h]=T.vb, one=T.sectors.length<3;
  S.W.named.forEach(n=>n.turns.forEach(t=>named[t]=n));
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(S.W.circuit)} track map with sectors and numbered corners">
  <defs><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  s+=T.sectors.map(d=>`<path class="trk-edge" d="${d}"/>`).join("");
  s+=T.sectors.map(d=>`<path class="trk-base" d="${d}"/>`).join("");
  s+=T.sectors.map((d,i)=>`<path class="trk-sec" id="sec${i}" d="${d}" stroke="${SECHEX[i]}"/>`).join("");
  s+=`<g id="zlayer"></g>`;
  s+=T.sectors.map((d,i)=>`<path class="trk-hit" d="${d}" data-tip="${one?esc("<b>"+S.W.circuit+"</b>\nSector splits unavailable for this layout"):"<b>Sector "+(i+1)+"</b>"}"/>`).join("");
  if(T.north){const N=T.north, P=[];
    T.sectors.forEach(d=>{const m=d.match(/-?\d+(\.\d+)?/g)||[];for(let i=0;i+1<m.length;i+=2)P.push([+m[i],+m[i+1]]);});
    (T.corners||[]).forEach(c=>P.push([c[3],c[4]]));
    const cand=[[w-48,52],[w-48,h*0.42],[48,h-48],[w*0.5,48],[w*0.62,48],[w-48,h*0.3]].filter(([x,y])=>!(x<400&&y<300)&&!(x>580&&y>480));
    let best=cand[0],bd=-1; cand.forEach(c=>{const dd=Math.min(...P.map(p=>(p[0]-c[0])**2+(p[1]-c[1])**2));if(dd>bd){bd=dd;best=c;}});
    const [ax,ay]=best, ang=Math.atan2(N[0],-N[1])*180/Math.PI;

  if(T.start){const [sx,sy,nx,ny]=T.start, px=-ny, py=nx;
  s+=`<line x1="${sx+px*22}" y1="${sy+py*22}" x2="${sx-px*22}" y2="${sy-py*22}" stroke="#000" stroke-width="10"/><line class="sf" x1="${sx+px*20}" y1="${sy+py*20}" x2="${sx-px*20}" y2="${sy-py*20}"/><text class="sflab" x="${sx-16}" y="${sy+34}" text-anchor="end">START / FINISH</text>`;}
  s+=`<g id="cnl">`+(T.corners||[]).map(([t,x,y,lx,ly])=>{
    const n=named[t], cls="cn"+(n?" named":"")+(n&&n.id===S.corner?" sel":"");
    const tip=n?`<b>Turn ${t}</b> · ${esc(n.short)}\nClick for the story`:`<b>Turn ${t}</b>`;
    return `<g class="${cls}" ${n?`data-corner="${n.id}" tabindex="0" role="button" aria-label="Turn ${t}, ${esc(n.short)}"`:""} data-tip="${esc(tip)}">
      <line x1="${x}" y1="${y}" x2="${lx}" y2="${ly}"/><circle class="ap" cx="${x}" cy="${y}" r="5"/><circle class="b" cx="${lx}" cy="${ly}" r="14"/><text x="${lx}" y="${ly+0.5}">${t}</text></g>`;
  }).join("")+`</g></svg>`;
  $("#map").innerHTML=s;
  drawZones();
}
// Straight Mode zones are drawn by distance along the lap, scaled to the official lap length (approximate).
function drawZones(){
  const Z=S.W&&S.W.zones; if(!Z||!S.W.track||S.W.track.sectors.length!==3) return;
  const paths=[0,1,2].map(i=>document.getElementById("sec"+i)); if(!paths[0]||!paths[0].getTotalLength) return;
  const pts=[]; let off=0;
  paths.forEach(p=>{const L=p.getTotalLength();for(let d=0;d<L;d+=2){const q=p.getPointAtLength(d);pts.push([q.x,q.y,off+d]);}off+=L;});
  const total=off, mPer=total/Z.lapM;
  const apex={}; S.W.track.corners.forEach(([t,x,y])=>{let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;bi=i;}});apex[t]=pts[bi][2];});
  const at=r=>((apex[r.turn]+r.m*mPer)%total+total)%total;
  const ptAt=d=>{let lo=0;for(let i=0;i<pts.length;i++){if(pts[i][2]>d)break;lo=i;}return pts[lo];};
  const seg=(a,b)=>{const out=[];if(b<a){pts.forEach(p=>{if(p[2]>=a)out.push(p);});pts.forEach(p=>{if(p[2]<=b)out.push(p);});}else pts.forEach(p=>{if(p[2]>=a&&p[2]<=b)out.push(p);});return out.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");};
  let g="";
  Z.straight.forEach((z,i)=>{const a=at(z.from),b=at(z.to),pl=seg(a,b);const tip=`<b>${esc(z.label)}</b>\n${esc(z.note)}\nPosition on map is approximate`;
    g+=`<polyline class="zone" points="${pl}"/><polyline class="zone-hit" points="${pl}" data-tip="${esc(tip)}"/>`;
    const m=ptAt((a+((b-a+total)%total)/2)%total); g+=`<text class="zlab" x="${m[0]+(z.dx||0)}" y="${m[1]+(z.dy||0)}" text-anchor="middle">SM${i+1}</text>`;});
  const o=Z.overtake, p=ptAt(at(o.detect));
  g+=`<g data-tip="${esc(`<b>Overtake Mode detection</b>\n${o.note}\nPosition on map is approximate`)}" style="cursor:help"><rect x="${p[0]-7}" y="${p[1]-7}" width="14" height="14" transform="rotate(45 ${p[0]} ${p[1]})" fill="#fff" stroke="#0b0c0e" stroke-width="3"/></g>`;
  $("#zlayer").innerHTML=g;
}

function sessState(now,W){
  const ss=(W||S.W).sessions.map(s=>{const a=Date.parse(s.start),b=a+s.mins*60000;return {...s,a,b,st:now>=b?"done":now>=a?"live":"up"};});
  const nx=ss.find(s=>s.st==="up"); if(nx&&!ss.some(s=>s.st==="live")) nx.st="next";
  return ss;
}
function renderSched(){
  const now=Date.now(), z=ZONES.find(x=>x[0]===S.zone)[1];
  $("#sched").innerHTML=sessState(now).map(s=>{
    const d=fmtDay(s.start,z);
    const pill=s.st==="live"?`<span class="pill live">● Live</span>`:s.st==="done"?`<span class="pill done">Finished</span>`:s.st==="next"?`<span class="pill next">In ${dur(s.a-now).replace(/:\d\d$/,"")}</span>`:`<span class="pill">Upcoming</span>`;
    const prog=s.st==="live"?`<div class="prog"><i style="width:${((now-s.a)/(s.b-s.a)*100).toFixed(1)}%"></i></div>`:"";
    return `<div class="sess${/Grand Prix/.test(s.name)?" race":""}"><div class="day">${d.wd}<b>${d.md}</b></div><div><div class="nm">${esc(s.name)}</div><div class="tm num">${fmtTime(s.start,z)} – ${fmtTime(new Date(s.b).toISOString(),z)} ${S.zone}</div></div>${pill}${prog}</div>`;
  }).join("");
}
let lastSched=0;
function tick(){
  const now=Date.now(), CW=WEEKENDS[CURRENT], ss=sessState(now,CW), lv=ss.find(s=>s.st==="live"), nx=ss.find(s=>s.st==="next");
  const el=$("#next");
  if(lv){el.className="next live";el.innerHTML=`<span class="dot"></span><span class="lbl">Live · ${esc(ROUNDS[CW.round-1].short)}</span><b>${esc(lv.name.split(" ·")[0])}</b><span class="num muted">${dur(lv.b-now)} left</span>`;}
  else if(nx){el.className="next";el.innerHTML=`<span class="dot"></span><span class="lbl">Next · ${esc(ROUNDS[CW.round-1].short)}</span><b>${esc(nx.name.split(" ·")[0])}</b><span class="num muted">${dur(nx.a-now)}</span>`;}
  else {el.className="next";el.innerHTML=`<span class="dot"></span><b>Weekend complete</b>`;}
  if(now-lastSched>15000){lastSched=now;renderSched();}
}

// ---------- Standings ----------
const SORTS=[["pos","Pos","l"],["name","Driver","l"],["team","Team","l"],["pts","Pts"],["wins","Wins"],["podiums","Pod"],["poles","Poles"],["avg","Avg fin","hide-s"],["dnfs","DNF","hide-s"],["gap","Gap"]];
function renderStandings(){
  const D=S.D.slice(), lead=S.D[0].pts, {k,asc}=S.sort;
  const val=d=>k==="gap"?lead-d.pts:k==="avg"?(d.avg??99):d[k];
  D.sort((a,b)=>{const x=val(a),y=val(b);const c=typeof x==="string"?x.localeCompare(y):x-y;return (asc?c:-c)||a.pos-b.pos;});
  const lr=ROUNDS[S.N-1];
  $("#asof").textContent=S.past?`After Round ${S.N} · ${lr.short}`:`Current · after Round ${S.N} · ${lr.short}`;
  $("#ctx").innerHTML=S.past?`<b>Championship after Round ${S.N}</b><span>As the standings stood after the ${esc(lr.gp)}${S.N<LASTDONE?` · ${LASTDONE-S.N} more round${LASTDONE-S.N>1?"s have":" has"} been run since`:""}</span>`
    :`<b>Current championship</b><span class="pill next">Latest</span><span>After Round ${S.N}, ${esc(lr.gp)}. ${S.W.round===LASTDONE+1?"This weekend's":"Round "+S.W.round+"'s"} results aren't in yet</span>`;
  $("#standings").innerHTML=`<table><thead><tr>${SORTS.map(([kk,l,c])=>`<th class="s ${c&&c!=="hide-s"?c:""} ${c==="hide-s"?"hide-s":""} ${kk===k?"on"+(asc?" asc":""):""}" data-sort="${kk}">${l}</th>`).join("")}</tr></thead><tbody>${
    D.map(d=>`<tr class="${d.code===S.pick?"pick":""}" data-pick="${d.code}" style="cursor:pointer"><td class="pos l">${d.pos}</td><td class="l"><span class="bar-l" style="--c:${tcol(d.team)}"><span class="dn">${esc(d.name)}</span></span><span class="cd hide-s">${d.code}</span></td><td class="l">${badge(d.team)}</td><td class="pts">${d.pts}</td><td>${d.wins}</td><td>${d.podiums}</td><td>${d.poles}</td><td class="hide-s">${d.avg??"–"}</td><td class="hide-s">${d.dnfs}</td><td class="dim">${d.pos===1?"Leader":"−"+(lead-d.pts)}</td></tr>`).join("")
  }</tbody></table>`;
}
const NARROW=()=>innerWidth<560;
function barsH(rows,max,{lab=58}={}){
  const rh=NARROW()?24:22,W=NARROW()?360:520,bw=W-lab-46;
  let s=`<svg viewBox="0 0 ${W} ${rows.length*rh+4}">`;
  rows.forEach((r,i)=>{const y=i*rh+2,w=Math.max(2,r.v/max*bw);
    s+=`<g data-tip="${esc(r.tip)}" style="cursor:default"><rect x="0" y="${y}" width="${W}" height="${rh-2}" fill="transparent"/>
    <text x="0" y="${y+14}" font-size="12" font-weight="700" fill="#f2f3f5">${esc(r.l)}</text>
    <rect x="${lab}" y="${y+3}" width="${w}" height="${rh-8}" rx="3" fill="${r.c}"/><text x="${lab+w+6}" y="${y+14}" font-size="12" fill="#a9aeb6" class="num">${r.v}</text></g>`;});
  return s+"</svg>";
}
function renderPtsBars(){
  const D=S.D,max=D[0].pts||1;
  $("#ptsbars").innerHTML=barsH(D.map(d=>({l:d.code,v:d.pts,c:tcol(d.team),tip:`<b>P${d.pos} ${d.name}</b>\n${d.team} · ${d.pts} pts\n${d.wins} wins · ${d.podiums} podiums${d.pos>1?`\n${D[0].pts-d.pts} behind the leader`:""}`})),max,{lab:40});
}

// ---------- Driver picker ----------
function renderChips(){$("#dchips").innerHTML=S.D.map(d=>`<button class="dchip${d.code===S.pick?" on":""}" data-pick="${d.code}" style="--c:${tcol(d.team)}" data-tip="${esc(`<b>${d.name}</b>\n${d.team}`)}"><i></i>${d.code}</button>`).join("");}
function cellClass(r){if(r==="")return "n";if(r==="R")return "r";if(r==="W")return "n";const n=+r;return n===1?"w":n<=3?"p":n<=10?"pt":"";}
function cellLabel(r){return r===""?"–":r==="W"?"DNS":r==="R"?"DNF":r;}
function columns(vals,labels,color,tips){
  const W=NARROW()?380:640,H=150,pb=18,max=Math.max(...vals,1),n=vals.length,cw=W/n;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  [0.5,1].forEach(f=>{const y=(H-pb)-(H-pb-14)*f;s+=`<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;});
  vals.forEach((v,i)=>{const h=(H-pb-14)*v/max,x=i*cw;
    s+=`<g data-tip="${esc(tips[i])}"><rect x="${x}" y="0" width="${cw}" height="${H}" fill="transparent"/><rect x="${x+cw*.18}" y="${H-pb-h}" width="${cw*.64}" height="${Math.max(h,v?1:0)}" rx="2" fill="${color}" opacity="${v?1:.25}"/>${v?`<text x="${x+cw/2}" y="${H-pb-h-4}" text-anchor="middle" font-size="10" fill="#a9aeb6">${v}</text>`:""}<text class="ax" x="${x+cw/2}" y="${H-4}" text-anchor="middle" style="${cw<30?"font-size:"+(cw<24?7.5:9)+"px":""}">${labels[i]}</text></g>`;});
  return s+"</svg>";
}

  const h2h=d.h2h.map(h=>{const m=S.D.find(x=>x.name===h.name), mc=m?tcol(m.team):"#888", mcode=m?m.code:last(h.name).slice(0,3).toUpperCase();

    return `<div class="sec-label">vs ${esc(h.name)} ${m?badge(m.team):""}</div><div class="h2h">${row("Race",h.rw,h.rl)}${row("Qualifying",h.qw,h.ql)}</div>`;}).join("");
  $("#driver").innerHTML=`<div class="dhead" style="--c:${c}"><div class="dnum">${d.num}</div><div><h3><span>${esc(d.name.split(" ").slice(0,-1).join(" "))}</span> ${esc(last(d.name))}</h3>
    <div class="meta">${badge(d.team,true)}<span>${esc(d.team)}</span><span class="dim">·</span><span>${esc(d.nat)}</span><span class="dim">·</span><span>#${d.num}</span></div></div></div>
  <div class="metrics">
    <div class="metric"><div class="k">Championship</div><div class="v">P${d.pos}</div><div class="d">${d.pos===1?`Leads by ${d.pts-S.D[1].pts}`:`${lead.pts-d.pts} behind ${lead.code}`}</div></div>
    <div class="metric"><div class="k">Points</div><div class="v">${d.pts}</div><div class="d">${d.spts} from sprints</div></div>
    <div class="metric"><div class="k">Wins · Podiums</div><div class="v">${d.wins} · ${d.podiums}</div><div class="d">${d.swins} sprint win${d.swins===1?"":"s"}</div></div>
    <div class="metric"><div class="k">Poles · Fastest laps</div><div class="v">${d.poles} · ${d.fl}</div><div class="d">Best finish P${d.best||"–"}</div></div>
    <div class="metric"><div class="k">Avg finish</div><div class="v">${d.avg??"–"}</div><div class="d">${d.classified} classified</div></div>
    <div class="metric"><div class="k">Starts</div><div class="v">${d.starts}</div><div class="d">${d.dns} DNS</div></div>
    <div class="metric"><div class="k">DNFs</div><div class="v">${d.dnfs}</div><div class="d">${d.starts?Math.round(d.dnfs/d.starts*100):0}% of starts</div></div>
    <div class="metric"><div class="k">Pts / race</div><div class="v">${(d.pts/Math.max(1,d.starts)).toFixed(1)}</div><div class="d">across ${d.starts} starts</div></div>
  </div>
  <div class="sec-label">Results by round</div><div class="strip" style="--c:${c}">${strip}</div><div class="rlab" style="${NARROW()?"font-size:8px":""}">${rounds.map(r=>`<span>${r}</span>`).join("")}</div>

// ---------- Title fight ----------
function renderFight(){
  $("#fightmode").innerHTML=[["cum","Points"],["gap","Gap to leader"]].map(([k,l])=>`<button class="${S.fight===k?"on":""}" data-fight="${k}">${l}</button>`).join("");
  const top=S.D.slice(0,4), n=top[0].cum.length, leadCum=top[0].cum.map((_,i)=>Math.max(...S.D.map(d=>d.cum[i])));
  const ser=top.map(d=>({d,v:S.fight==="cum"?d.cum:d.cum.map((v,i)=>v-leadCum[i])}));
  const all=ser.flatMap(s=>s.v), max=Math.max(...all,0), min=Math.min(...all,0);
  const nw=NARROW(), W=nw?420:1000,H=nw?300:320,l=nw?36:44,r=nw?46:60,t=12,b=24, x=i=>n>1?l+i*(W-l-r)/(n-1):l+(W-l-r)/2, y=v=>t+(max-v)/(max-min||1)*(H-t-b);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  const step=Math.pow(10,Math.floor(Math.log10((max-min)||1)))*( (max-min)/Math.pow(10,Math.floor(Math.log10((max-min)||1)))>5?1:.5);
  for(let v=Math.ceil(min/step)*step;v<=max;v+=step)s+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const RR=S.A.rounds;
  for(let i=0;i<n;i++)if(!nw||n<10||i%2===0||i===n-1)s+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${RC(RR[i])}</text>`;
  const seen={};
  ser.forEach(({d,v})=>{const c=tcol(d.team),dash=seen[d.team]?'stroke-dasharray="7 5"':"";seen[d.team]=1;
    s+=`<polyline points="${v.map((p,i)=>x(i)+","+y(p)).join(" ")}" fill="none" stroke="${c}" stroke-width="3" ${dash} stroke-linejoin="round"/>`;
    s+=`<circle cx="${x(n-1)}" cy="${y(v[n-1])}" r="4" fill="${c}"/>`;});
  // end labels, pushed apart so they never overlap
  const labs=ser.map(({d,v})=>({d,y:y(v[n-1])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
  labs.forEach(o=>s+=`<text x="${x(n-1)+9}" y="${o.y+4}" font-size="13" font-weight="700" fill="${tcol(o.d.team)}">${o.d.code}</text>`);
  s+=`<line id="xh" class="gl" x1="0" x2="0" y1="${t}" y2="${H-b}" style="stroke:rgba(255,255,255,.35);display:none"/>`;
  for(let i=0;i<n;i++){const rows=ser.map(({d,v})=>({d,v:v[i]})).sort((a,b)=>b.v-a.v);
    s+=`<rect data-x="${x(i)}" class="fh" x="${x(i)-(W-l-r)/Math.max(1,n-1)/2}" y="${t}" width="${(W-l-r)/Math.max(1,n-1)}" height="${H-t-b}" fill="transparent" data-tip="${esc(`<b>After ${RN(RR[i])}</b>\n`+rows.map(o=>`${o.d.code}  ${S.fight==="cum"?o.v+" pts":(o.v===0?"leader":o.v)}`).join("\n"))}"/>`;}
  $("#fight").innerHTML=s+"</svg>";
}

// ---------- Tooltip + events ----------
const tip=$("#tip"); let tipEl=null;
function showTip(el,x,y){tipEl=el;tip.innerHTML=el.getAttribute("data-tip");tip.classList.add("on");moveTip(x,y);
  if(el.classList.contains("fh")){const xh=$("#xh");if(xh){xh.style.display="";xh.setAttribute("x1",el.dataset.x);xh.setAttribute("x2",el.dataset.x);}}}
function moveTip(x,y){const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(8,L)+"px";tip.style.top=Math.max(8,T)+"px";}
function hideTip(){tipEl=null;tip.classList.remove("on");const xh=$("#xh");if(xh)xh.style.display="none";}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(!el){if(tipEl)hideTip();return;}if(el!==tipEl)showTip(el,e.clientX,e.clientY);else moveTip(e.clientX,e.clientY);});
document.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){const el=e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else hideTip();}});
window.addEventListener("scroll",()=>{if(tipEl)hideTip();},{passive:true});
document.addEventListener("click",e=>{
  if(e.target.closest("#calprev")) return go(-1);
  if(e.target.closest("#calnext")) return go(1);
  const t=e.target.closest("[data-corner],[data-zone],[data-sort],[data-pick],[data-fight],[data-last],[data-kind],[data-wk]"); if(!t) return;
  const ds=t.dataset;
  if(ds.corner) pickCorner(ds.corner,!!t.closest("#map"));
  else if(ds.zone){S.zone=ds.zone;renderZones();renderSched();}
  else if(ds.sort){S.sort=S.sort.k===ds.sort?{k:ds.sort,asc:!S.sort.asc}:{k:ds.sort,asc:["pos","name","team","avg","gap","dnfs"].includes(ds.sort)};renderStandings();}
  else if(ds.pick){S.pick=ds.pick;renderDriver();if(t.tagName==="TR")$("#dchips").scrollIntoView({behavior:"smooth",block:"center"});}
  else if(ds.fight){S.fight=ds.fight;renderFight();}
  else if(ds.last!==undefined){S.lastAll=ds.last==="true";renderLast();}
  else if(ds.kind){S.kind=ds.kind;renderLast();}
  else if(ds.wk){history.replaceState(null,"","#"+ds.wk);setWeekend(ds.wk);}
});
document.addEventListener("keydown",e=>{
  if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    const a=document.activeElement; if(a&&(a.closest(".tbl-wrap")||/INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
    e.preventDefault(); go(e.key==="ArrowLeft"?-1:1); const b=$("#cal .wk.on"); if(a&&a.closest&&a.closest("#cal")&&b) b.focus({preventScroll:true}); return;}if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.corner&&e.target.tagName!=="BUTTON"){e.preventDefault();pickCorner(e.target.dataset.corner,true);}});
let wasNarrow=NARROW();

// swipe left/right on the track map to move between weekends (phones)
(()=>{let x0=null,y0=0;const h=$("#hero");
  h.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  h.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8)go(dx<0?1:-1);},{passive:true});})();
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(WEEKENDS[k]&&k!==S.key)setWeekend(k);});
setWeekend(WEEKENDS[location.hash.slice(1)]?location.hash.slice(1):DEFAULT_WEEKEND,false);
